[package]
name = "rustagotchi"
version = "0.1.0"
edition = "2021"
description = "Terminal Virtual Pet (Tamagotchi) in Rust with Git Commit XP Hooks, SQLite/JSON Persistence, and Ratatui Dashboard"
authors = ["Rustagotchi Contributors"]
license = "MIT"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
