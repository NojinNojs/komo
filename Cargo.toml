[package]
name = "mochigotchi"
version = "1.0.0"
edition = "2021"
description = "KOMO — Pocket Soul & Living Terminal Companion (40x22 TrueColor Pixel Art, 4 Senses, Real Consequences)"
authors = ["Muhammad Raffi Aqsan (NojinNojs)"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/NojinNojs/komo"
homepage = "https://github.com/NojinNojs/komo"
keywords = ["komo", "tamagotchi", "virtual-pet", "tui", "ratatui"]
categories = ["games", "command-line-utilities"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
