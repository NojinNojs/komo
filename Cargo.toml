[package]
name = "mochigotchi"
version = "0.3.0"
edition = "2021"
description = "Mochigotchi — Your Cozy Pocket Pet in the Terminal (Universal Tamagotchi Simulator with Ratatui & SQLite/JSON Persistence)"
authors = ["Mochigotchi Contributors"]
license = "MIT"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
