[package]
name = "mochigotchi"
version = "1.0.0"
edition = "2021"
description = "Mochigotchi — Minimalist Retro Handheld V-Pet & 32x20 TrueColor Pixel Art Tamagotchi in the Terminal"
authors = ["Muhammad Raffi Aqsan (NojinNojs)"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/NojinNojs/mochigotchi"
homepage = "https://github.com/NojinNojs/mochigotchi"
keywords = ["tamagotchi", "virtual-pet", "tui", "ratatui", "pixel-art"]
categories = ["games", "command-line-utilities"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
